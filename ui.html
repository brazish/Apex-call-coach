<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080C10;color:#C8D8E4;font-family:monospace;padding:20px;font-size:14px}
.hdr{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid #1E2D3D;margin-bottom:18px}
.logo{width:46px;height:46px;background:linear-gradient(135deg,#00E5FF,#0080FF);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px}
.t1{font-size:20px;font-weight:800;color:#EFF6FB}
.t2{font-size:10px;color:#00E5FF;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.mc{background:#131A22;border:1px solid #1E2D3D;border-radius:9px;padding:12px;text-align:center}
.mv{font-size:22px;font-weight:800;color:#EFF6FB}
.ml{font-size:9px;color:#4A6070;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.btns{display:flex;gap:10px;margin-bottom:10px}
.btn{flex:1;padding:11px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.bs{background:linear-gradient(135deg,#00B8CC,#0080FF);color:#000}
.bx{background:#131A22;color:#FF3B5C;border:1px solid rgba(255,59,92,0.4)}
.bc{background:#131A22;color:#4A6070;border:1px solid #1E2D3D}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.sb{font-size:12px;color:#00E5FF;padding:5px 0;min-height:22px}
.ib{font-size:12px;color:#4A6070;font-style:italic;min-height:18px;padding:3px 0}
.eb{background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.3);border-radius:7px;padding:9px 13px;color:#FF3B5C;font-size:12px;margin:6px 0;display:none}
.cols{display:grid;grid-template-columns:55fr 45fr;gap:20px;margin-top:18px}
.st{font-size:15px;font-weight:700;color:#EFF6FB;margin-bottom:10px}
.box{background:#090D11;border:1px solid #1E2D3D;border-radius:8px;padding:14px;min-height:260px;max-height:380px;overflow-y:auto;font-size:12px;line-height:1.9}
.tl{margin:3px 0}
.ts{color:#00E5FF;font-weight:500}
.te{color:#4A6070;font-style:italic}
.cc{border-radius:9px;padding:12px;margin-bottom:9px;border-left:3px solid #00E5FF;background:#131A22;font-size:13px;line-height:1.6}
.cc.objection{border-left-color:#FF3B5C}
.cc.tip{border-left-color:#FFD60A}
.cc.positive{border-left-color:#00FF9D}
.ct{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-bottom:5px;display:inline-block}
.to{background:rgba(255,59,92,0.15);color:#FF3B5C}
.tt{background:rgba(255,214,10,0.15);color:#FFD60A}
.tp{background:rgba(0,255,157,0.15);color:#00FF9D}
.tk{background:rgba(0,229,255,0.10);color:#00E5FF}
.cts{font-size:9px;color:#4A6070;float:right}
.ce{text-align:center;padding:28px 0;color:#4A6070;font-size:12px}
.pl{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:11px}
.live{background:rgba(0,255,157,0.12);color:#00FF9D;border:1px solid rgba(0,255,157,0.3)}
.idle{background:rgba(74,96,112,0.2);color:#4A6070;border:1px solid #1E2D3D}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dg{background:#00FF9D;animation:blink 1.2s infinite}
.dy{background:#4A6070}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">🎯</div>
  <div><div class="t1">APEX Call Coach</div><div class="t2">Live AI Sales Intelligence</div></div>
</div>
<div class="metrics">
  <div class="mc"><div class="mv" id="md">00:00</div><div class="ml">Duration</div></div>
  <div class="mc"><div class="mv" id="mw">0</div><div class="ml">Words</div></div>
  <div class="mc"><div class="mv" id="mo" style="color:#FF3B5C">0</div><div class="ml">Objections</div></div>
  <div class="mc"><div class="mv" id="mi" style="color:#00E5FF">0</div><div class="ml">Insights</div></div>
  <div class="mc"><div id="ms"><span class="pl idle"><span class="dot dy"></span>IDLE</span></div><div class="ml" style="margin-top:5px">Status</div></div>
</div>
<div class="btns">
  <button class="btn bs" id="bst" onclick="go()">▶ Start Listening</button>
  <button class="btn bx" id="bsp" onclick="stop()" disabled>◼ Stop</button>
  <button class="btn bc" onclick="clr()">🗑 Clear</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
<div class="ib" id="ib"></div>
<div class="eb" id="eb"></div>
<div class="cols">
  <div>
    <div class="st">🎙️ Live Transcript</div>
    <div class="box" id="tb"><div class="te">Transcript will appear here when you start listening...</div></div>
  </div>
  <div>
    <div class="st">💡 Live Coaching Feed</div>
    <div class="box" id="cb"><div class="ce">🎤<br><br>Coaching insights will appear here.<br><br><span style="color:#00E5FF">Start listening to begin.</span></div></div>
  </div>
</div>
<script>
const DG="__DG__",CL="__CL__",LANG="__LANG__",CI=__CI__;
let sock,actx,proc,src,ms,rec=false,t0=null,tmr=null,W=0,O=0,I=0,WC=0,lines=[],pend="",lc=0;
const $=x=>document.getElementById(x);
const ts=()=>new Date().toLocaleTimeString("en-US",{hour12:false});
function ss(m,c="#00E5FF"){$("sb").style.color=c;$("sb").textContent=m;}
function err(m){$("eb").textContent="❌ "+m;$("eb").style.display="block";}
function cerr(){$("eb").style.display="none";}
function live(on){
  $("ms").innerHTML=on?"<span class='pl live'><span class='dot dg'></span>LIVE</span>":"<span class='pl idle'><span class='dot dy'></span>IDLE</span>";
  $("bst").disabled=on;$("bsp").disabled=!on;
}
function upd(){$("mw").textContent=W;$("mo").textContent=O;$("mi").textContent=I;}
function stmr(){t0=Date.now();tmr=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("md").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},500);}
function xtmr(){clearInterval(tmr);}
function addLine(t,tx){
  const b=$("tb"),e=b.querySelector(".te");if(e)e.remove();
  const d=document.createElement("div");d.className="tl";
  d.innerHTML="<span class='ts'>["+t+"] You</span>: "+tx;
  b.appendChild(d);b.scrollTop=b.scrollHeight;
}
function addCoach(type,content,t){
  const b=$("cb"),e=b.querySelector(".ce");if(e)e.remove();
  const m={objection:["🚨","to","OBJECTION"],tip:["💡","tt","TIP"],positive:["✅","tp","GREAT MOVE"],coach:["🎯","tk","COACHING"]};
  const[icon,cls,lbl]=m[type]||m.coach;
  const d=document.createElement("div");d.className="cc "+type;
  d.innerHTML="<span class='ct "+cls+"'>"+icon+" "+lbl+"</span><span class='cts'>"+t+"</span><div style='clear:both;margin-top:4px'>"+content+"</div>";
  b.insertBefore(d,b.firstChild);
}
async function coach(chunk,full){
  if(!CL)return;
  try{
    const sys="You are APEX, a real-time sales call coach.\nProduct: "+(getPROD()||"the product")+"\nPersona: "+(getPERS()||"a busiion-maker")+"\nTranscript: "+full.slice(-2000)+"\nLatest: "+chunk+'\nReply ONLY in raw JSON: {"type":"objection"|"tip"|"positive"|"coach"|"none","content":"1-3 sentence tip","urgency":"high"|"medium"|"low"}';
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"x-api-key":CL,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:200,system:sys,messages:[{role:"user",content:"Coach me."}]})
    });
    const data=await r.json();
    const raw=(data.content?.[0]?.text||"").trim().replace(/^```[a-z]*\n?|\n?```$/g,"");
    const res=JSON.parse(raw);
    if(res.type&&res.type!=="none"){I++;addCoach(res.type,res.content,ts());if(res.type==="objection")O++;upd();}
  }catch(e){console.error(e);}
}
function final(tx){
  const t=ts();addLine(t,tx);lines.push(tx);
  const w=tx.trim().split(/\s+/).length;W+=w;WC+=w;pend+=" "+tx;upd();
  const now=Date.now();
  if(WC>=CI&&(now-lc)>8000){coach(pend.trim(),lines.join(" "));lc=now;WC=0;pend="";}
}
async function go(){
  cerr();
  if(!DG){err("Add your Deepgram API key in the sidebar.");return;}
  if(!CL){err("Add your Anthropic API key in the sidebar.");return;}
  try{
    ms=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    ss("🎙️ Connecting to Deepgram...");
    const p=new URLSearchParams({language:LANG,model:"nova-2",smart_format:"true",interim_results:"true",punctuate:"true",endpointing:"300",encoding:"linear16",sample_rate:"16000"});
    sock=new WebSocket("wss://api.deepgram.com/v1/listen?"+p,["token",DG]);
    sock.binaryType="arraybuffer";
    sock.onopen=()=>{
      ss("✅ LIVE — Listening...");live(true);rec=true;stmr();
      actx=new AudioContext({sampleRate:16000});
      src=actx.createMediaStreamSource(ms);
      proc=actx.createScriptProcessor(4096,1,1);
      src.connect(proc);proc.connect(actx.destination);
      proc.onaudioprocess=e=>{
        if(sock.readyState!==WebSocket.OPEN)return;
        const f=e.inputBuffer.getChannelData(0),i=new Int16Array(f.length);
        for(let x=0;x<f.length;x++)i[x]=Math.max(-32768,Math.min(32767,f[x]*32768));
        sock.send(i.buffer);
      };
    };
    sock.onmessage=e=>{
      const d=JSON.parse(e.data);if(d.type!=="Results")return;
      const a=(d.channel?.alternatives||[{}])[0];
      const tx=(a.transcript||"").trim();if(!tx)return;
      if(d.is_final){$("ib").textContent="";final(tx);}
      else{$("ib").textContent="… "+tx;}
    };
    sock.onerror=()=>{err("Deepgram error — check your API key.");stop();};
    sock.onclose=()=>{if(rec)ss("⏹ Disconnected.");live(false);rec=false;xtmr();};
  }catch(e){err("Mic error: "+e.message);}
}
function stop(){
  rec=false;xtmr();live(false);ss("⏹ Stopped.");$("ib").textContent="";
  if(sock)sock.close();
  if(proc){proc.disconnect();proc=null;}
  if(src){src.disconnect();src=null;}
  if(actx){actx.close();actx=null;}
  if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;}
}
function clr(){
  stop();W=0;O=0;I=0;WC=0;lines=[];pend="";lc=0;
  $("md").textContent="00:00";$("ib").textContent="";
  $("tb").innerHTML="<div class='te'>Transcript will appear here when you start listening...</div>";
  $("cb").innerHTML="<div class='ce'>🎤<br><br>Coaching insights will appear here.<br><br><span style='color:#00E5FF'>Start listening to begin.</span></div>";
  cerr();upd();ss("👆 Enter API keys in the sidebar then click Start Listening.");
}
</script>
</body>
</html>
